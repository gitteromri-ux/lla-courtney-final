          - { id: '10zhcP0mrOPltRVcRQD59hn54kRnuf1_D', out: 'LIPFIX_S2.wav', size: '88278' }
          - { id: '1Ltl133DrWWLiXBi4aJEo4tbWmGD6ZdXd', out: 'LIPFIX_S3.wav', size: '693922' }
          - { id: '1k1Uc9qJKjUVRcQLJEFYoHeWcWquocNK0', out: 'LIPFIX_S4.wav', size: '307896' }
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download from Drive
        run: |
          set -e
          for attempt in 1 2 3; do
            curl -sL -C - -A "Mozilla/5.0" \
              "https://drive.usercontent.google.com/download?id=${{ matrix.f.id }}&export=download&confirm=t" \
              -o "${{ matrix.f.out }}" || true
            S=$(stat -c%s "${{ matrix.f.out }}")
            echo "attempt $attempt got $S bytes"
            if [ "$S" -gt 50000 ]; then break; fi
            rm -f "${{ matrix.f.out }}"
          done
          ls -la "${{ matrix.f.out }}"
          S=$(stat -c%s "${{ matrix.f.out }}")
          test "$S" -gt 50000
          head -c 200 "${{ matrix.f.out }}" | grep -qi "<html" && { echo "GOT HTML NOT FILE"; exit 1; } || true
      - name: Upload to release
        run: gh release upload "$TAG" "${{ matrix.f.out }}" --repo ${{ github.repository }} --clobber
  verify:
    needs: pull
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          gh release view "$TAG" --repo ${{ github.repository }} --json assets \
            -q '.assets[] | "\(.name) \(.size)"' | sort
          N=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets -q '.assets|length')
          echo "asset count = $N"
          test "$N" -ge 40
