          - { id: '160JhFGcJ5YoGY8ll63MGLtbn2osWwGZE', out: 'GRAPHIC_CARD_1.png', size: '119325' }
          - { id: '134mchTr1DTAzX89GGkkZlezawyBJqzoE', out: 'GRAPHIC_02_MISSION.png', size: '1336320' }
          - { id: '1FqNe8efiUk5UL8hu8u1mZVDHmNrL_GCW', out: 'AUDIO_MUSIC_River.m4a', size: '1819499' }
          - { id: '1DN1uruKS-vb2Ie1oxTsHLW_CvfZtfACT', out: 'LIPFIX_S1.mp4', size: '2221319' }
          - { id: '1XNGHskiFlLK22p_B4B6bdZ8c3H0m0sDu', out: 'LIPFIX_S2.mp4', size: '956762' }
          - { id: '1z_OD-fMcHZL-tGYRNo3vvOi15JDR55sO', out: 'LIPFIX_S3.mp4', size: '5076950' }
