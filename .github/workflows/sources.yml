name: sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sources.yml']
permissions:
  contents: write
env:
  TAG: editor-sources-v1
jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1 || \
          gh release create "$TAG" --repo ${{ github.repository }} --title "Editor source footage — original files, no text burned in" --notes "Every original camera, b-roll and graphic source file. Direct download."
  pull:
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        f:
          - { id: '1nIb89VEMytwl4u1Jmn8JMn6T2YTmVtpl', out: 'RAW_Courtney_FRONT_PRO.mp4', size: '1311135197' }
          - { id: '1aAHLQ70jzJIne7miLERBcHi5vwqEIvK3', out: 'RAW_Julie_MAIN_CAMERA.mp4', size: '974501325' }
          - { id: '1FyzS-o7RoE-1OqLWQrjSDsGXYYmwQ08K', out: 'RAW_Julie_SECOND_CAMERA.mp4', size: '2437801765' }
          - { id: '1DIpW4215BYKk17wgdhfc7qWloWypgC1I', out: 'RAW_Courtney_TESTIMONIALS_SESSION.mp4', size: '236695345' }
          - { id: '1KU-unbrr58_Z6IH_6n8luMRkRfBL_z1m', out: 'MASTER_LLA_Courtney_90s_v17_4K.mp4', size: '452036142' }
